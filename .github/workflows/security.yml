name: 'Security Checks'

## For readability and asynchronicity, the code for all 10 jobs is not in a loop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, labeled]
    paths: # only loads on changes of dependencies
      - '**/package-lock.json'
      - '.github/workflows/security.yml'

permissions: {}

jobs:
  gate: # runs only for some actions
    runs-on: ubuntu-latest
    if: >-
      github.event.action != 'labeled'
      || github.event.label.name == '🛡️ security update'
      || github.event.label.name == 'deptrack-reload'
    steps:
      - run: echo "Security scan triggered by ${{ github.event_name }}/${{ github.event.action }}"

  check_risk_score:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
    outputs:
      riskscore: ${{ steps.riskscoreFromDT.outputs.riskscore }}
      status: ${{ steps.riskscoreFromDT.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upload and wait for analysis result
      - name: Generates BoM and upload to OWASP DTrack
        id: riskscoreFromDT
        uses: 1024pix/check-dependency-track-action/node@3f4ca48509e2e15b2f201e456d7f7e9fc2fe39f1 # v1.1.2
        with:
          url: ${{ secrets.DEPENDENCYTRACK_URL }}
          key: '${{ secrets.DEPENDENCYTRACK_APIKEY }}'
          directory: '.'
          basic_user: '${{ vars.DEPENDENCYTRACK_BASIC_USER }}'
          basic_password: '${{ secrets.DEPENDENCYTRACK_BASIC_PASSWORD }}'

  comment_on_pr:
    runs-on: ubuntu-latest
    needs: check_risk_score
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.check_risk_score.outputs.status != '' }}
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          SCORE: ${{ needs.check_risk_score.outputs.riskscore }}
          STATUS: ${{ needs.check_risk_score.outputs.status }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Dependency-Track: **${STATUS}**, risk score **${SCORE}**"

      - name: Fail on policy violation
        env:
          STATUS: ${{ needs.check_risk_score.outputs.status }}
        run: |
          case "$STATUS" in
            pass|warn) echo "Dependency-Track status: $STATUS" ;;
            fail)      echo "::error::Dependency-Track policy violation (fail)"; exit 1 ;;
            *)         echo "::error::Unknown or missing status: '$STATUS'"; exit 1 ;;
          esac
