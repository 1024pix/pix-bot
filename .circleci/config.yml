version: 2.1

jobs:
  build-and-test:
    parameters:
      node-version:
        # renovate datasource=node-version depName=node
        default: 24.22.1
        type: string
    docker:
      - image: cimg/node:<<parameters.node-version>>
      - image: postgres:16.9-alpine
        name: pg-pix-bot
        environment:
          POSTGRES_USER: circleci
          POSTGRES_HOST_AUTH_METHOD: trust
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npm run lint
      - run:
          name: Test
          command: npm run test -- --reporter-option=showRelativePaths --reporter-option output=/home/circleci/test-results/test-results.xml
          environment:
            TEST_DATABASE_URL: postgres://circleci@pg-pix-bot:5432/circleci
            MOCHA_REPORTER: xunit
            when: always
      - store_test_results:
          path: /home/circleci/test-results
      - store_artifacts:
          path: /home/circleci/test-results

workflows:
  build_and_test:
    jobs:
      - build-and-test
